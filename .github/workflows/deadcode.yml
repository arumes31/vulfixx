name: Deadcode Check

on:
  push:
    branches: [ "main", "v2_test" ]
  pull_request:
    branches: [ "main", "v2_test" ]

permissions:
  contents: read

jobs:
  deadcode:
    name: Check Dead Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install deadcode tool
        run: go install golang.org/x/tools/cmd/deadcode@v0.40.0

      - name: Run deadcode scan
        run: |
          OUTPUT=$($(go env GOPATH)/bin/deadcode -test ./...)
          if [ -n "$OUTPUT" ]; then
            echo "Dead code detected in the repository:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "No dead code found."
