name: GHCR cleanup
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without deleting images
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: ghcr-retention
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Prune only old unreferenced untagged manifests
        # v3.1 preserves platform/SBOM/provenance children of retained OCI indexes.
        # Tagged versions and commit tags remain available for rollback.
        uses: docker://ghcr.io/snok/container-retention-policy@sha256:884037f146d6ef574b61fbcc59bef490f887322e6b9dc2eefcf364cb4e9b4112
        with:
          args: >-
            --account=user
            --token=${{ secrets.GITHUB_TOKEN }}
            --image-names=${{ github.event.repository.name }},${{ github.event.repository.name }}-ollama
            --tag-selection=untagged
            --timestamp-to-use=updated_at
            --cut-off=30d
            --dry-run=${{ inputs.dry_run }}
        env:
          RUST_LOG: container_retention_policy=INFO

  cleanup-workflow-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          echo "--- Processing Workflow Runs ---"
          # Fetch up to 500 runs
          RUNS_JSON=$(gh run list --repo $GITHUB_REPOSITORY --limit 500 --json databaseId,createdAt,status,conclusion)
          
          # Filter and select IDs to delete:
          # 1. Filter only "completed" runs
          # 2. Sort by createdAt descending (most recent first)
          # 3. Keep the 30 most recent completed runs
          # 4. Extract IDs of the older ones
          IDS_TO_DELETE=$(echo "$RUNS_JSON" | jq -r '
            map(select(.status == "completed")) |
            sort_by(.createdAt) | reverse |
            .[30:] | .[].databaseId
          ')
          
          if [ -z "$IDS_TO_DELETE" ] || [ "$IDS_TO_DELETE" == "null" ]; then
            echo "No old workflow runs to delete (kept 30 most recent completed runs)."
          else
            for RUN_ID in $IDS_TO_DELETE; do
              echo "Targeting workflow run ID: $RUN_ID"
              if [ "$DRY_RUN" == "false" ]; then
                echo "Deleting workflow run $RUN_ID..."
                gh run delete --repo $GITHUB_REPOSITORY "$RUN_ID"
              else
                echo "[DRY RUN] Would delete workflow run $RUN_ID"
              fi
            done
          fi
