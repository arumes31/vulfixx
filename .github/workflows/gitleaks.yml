name: Gitleaks

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly full-history scan; every push/PR is scanned as well

permissions:
  contents: read

concurrency:
  # gitleaks-action scans only each push's commits, so pending main scans must never be replaced
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Fetch all history for historical scan

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_VERSION: 8.30.1
