name: Gitleaks

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Run daily to catch any leaks in historical commits

jobs:
  scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for historical scan

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
