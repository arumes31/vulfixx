services:
  app:
    image: ghcr.io/arumes31/vulfixx:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=cveuser
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=cvetracker
      - DB_PORT=5432
      - REDIS_URL=redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - SESSION_KEY=${SESSION_KEY:?SESSION_KEY is required}
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-user@example.com}
      - SMTP_PASS=${SMTP_PASS:-password}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - CSRF_KEY=${CSRF_KEY:?CSRF_KEY is required}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      - ADMIN_TOTP_SECRET=${ADMIN_TOTP_SECRET:?ADMIN_TOTP_SECRET is required}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-phi3-vulfixx}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_API_VERSION=${GEMINI_API_VERSION:-v1beta}
      - GEMINI_RPM=${GEMINI_RPM:-15}
      - GEMINI_RPD=${GEMINI_RPD:-500}
      # Higher-quality, low-quota Gemini failovers tried BEFORE flash-lite when in
      # LLM_PROVIDER (e.g. LLM_PROVIDER=gemini35flash,gemini3flash,gemini31flashlite,...).
      - GEMINI35FLASH_MODEL=${GEMINI35FLASH_MODEL:-gemini-3.5-flash}
      - GEMINI35FLASH_RPM=${GEMINI35FLASH_RPM:-5}
      - GEMINI35FLASH_RPD=${GEMINI35FLASH_RPD:-20}
      - GEMINI3FLASH_MODEL=${GEMINI3FLASH_MODEL:-gemini-3-flash-preview}
      - GEMINI3FLASH_RPM=${GEMINI3FLASH_RPM:-5}
      - GEMINI3FLASH_RPD=${GEMINI3FLASH_RPD:-20}
      - LLM_DEBUG=${LLM_DEBUG:-false}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - MISTRAL_ENDPOINT=${MISTRAL_ENDPOINT:-https://api.mistral.ai/v1}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      - db
      - redis
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

  db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    environment:
      - POSTGRES_USER=cveuser
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=cvetracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  ollama:
    image: ghcr.io/arumes31/vulfixx-ollama:v2_test
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=600s
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_DEBUG=1
    restart: unless-stopped

volumes:
  pgdata:

# Volumes are now bind-mounted to local directories
