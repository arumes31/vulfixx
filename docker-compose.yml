version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - DB_HOST=db
      - DB_USER=cveuser
      - DB_PASSWORD=cvepass
      - DB_NAME=cvetracker
      - DB_PORT=5432
      - REDIS_URL=redis:6379
      - APP_ENV=${APP_ENV:-development}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-vulfixx-default-dev-secret-key-32bytes}
      - SESSION_KEY=${SESSION_KEY:-supersecretkey-change-me-in-prod}
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-user@example.com}
      - SMTP_PASS=${SMTP_PASS:-password}
      - BASE_URL=${BASE_URL:-http://localhost:8080}
      - CSRF_KEY=${CSRF_KEY:-MOCK_CSRF_KEY_32_BYTES_FOR_TEST!}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-adminpassword}
      - ADMIN_TOTP_SECRET=${ADMIN_TOTP_SECRET:-JBSWY3DPEHPK3PXP}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://ollama:11434}
      - LLM_MODEL=${LLM_MODEL:-phi3-vulfixx}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_API_VERSION=${GEMINI_API_VERSION:-v1beta}
      - GEMINI_RPM=${GEMINI_RPM:-15}
      - GEMINI_RPD=${GEMINI_RPD:-500}
      # Higher-quality, low-quota Gemini failovers tried BEFORE flash-lite when in
      # LLM_PROVIDER (e.g. LLM_PROVIDER=gemini35,gemini3,gemini,gemma,gemma2,...).
      - GEMINI35_MODEL=${GEMINI35_MODEL:-gemini-3.5-flash}
      - GEMINI35_RPM=${GEMINI35_RPM:-5}
      - GEMINI35_RPD=${GEMINI35_RPD:-20}
      - GEMINI3_MODEL=${GEMINI3_MODEL:-gemini-3-flash-preview}
      - GEMINI3_RPM=${GEMINI3_RPM:-5}
      - GEMINI3_RPD=${GEMINI3_RPD:-20}
      # Gemma failover (used when LLM_PROVIDER includes "gemma"): same Google API
      # key, higher daily quota. Set GEMMA_MODEL to the exact API model id.
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma-4-31b-it}
      - GEMMA_RPM=${GEMMA_RPM:-15}
      - GEMMA_RPD=${GEMMA_RPD:-1500}
      # Second Gemma failover (LLM_PROVIDER includes "gemma2"); its own daily quota.
      - GEMMA2_MODEL=${GEMMA2_MODEL:-gemma-4-26b-a4b-it}
      - GEMMA2_RPM=${GEMMA2_RPM:-15}
      - GEMMA2_RPD=${GEMMA2_RPD:-1500}
      - LLM_DEBUG=${LLM_DEBUG:-false}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-mistral-small-latest}
      - MISTRAL_ENDPOINT=${MISTRAL_ENDPOINT:-https://api.mistral.ai/v1}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=cveuser
      - POSTGRES_PASSWORD=cvepass
      - POSTGRES_DB=cvetracker
    ports:
       - "5432:5432"  # Only expose for local development; not for production
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Only expose for local development; not for production
    volumes:
      - ./data/redis:/data
    restart: unless-stopped


  ollama:
    build: ./addons/ollama-init
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_LOAD_TIMEOUT=600s
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_DEBUG=1
    restart: unless-stopped

volumes:
  pgdata:

# Volumes: pgdata is a named volume, redis uses bind mounts to local directories.

